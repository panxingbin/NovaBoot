spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nova;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/h2
  autoconfigure:
    # local 保持零外部依賴：排除 Sa-Token 的 Redis DAO，回退框架默認的內存實現
    exclude: cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate

logging:
  level:
    com.novaboot: debug

nova:
  # 本地無 Redis/行為驗證碼服務時，M0 先關閉驗證碼校驗，便於聯調與冒煙測試
  captcha:
    enabled: false
