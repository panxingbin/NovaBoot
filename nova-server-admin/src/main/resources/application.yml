server:
  port: 8080

spring:
  application:
    name: nova-boot
  profiles:
    # 默認 local（H2 內存庫，零依賴啟動）；生產切 mysql：--spring.profiles.active=mysql
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  # 僅對內存 DAO 生效（local profile）；mysql profile 會話存 Redis，查詢實時
  data-refresh-period: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

nova:
  captcha:
    enabled: true
  init:
    admin-password: admin123
  storage:
    # 檔案本地存儲根目錄（相對應用工作目錄）
    local-path: ./data/files
    # 拒絕上傳的擴展名（逗號分隔，大小寫不敏感），防止可執行/服務端腳本文件落地
    denied-extensions: jsp,jspx,jspf,war,sh,bash,bat,cmd,exe,dll,php,asp,aspx,ascx,cer,cdx,ashx,asmx,py,pl
