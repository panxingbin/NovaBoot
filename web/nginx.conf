# NovaBoot 前端站點：SPA 靜態資源 + /api 反向代理
# 由 web/Dockerfile 放置到 /etc/nginx/conf.d/default.conf（nginx:alpine 默認 server 塊已移除）

server {
    listen 80;
    server_name _;

    # 前端構建產物（web/apps/admin/dist），由 Dockerfile 拷貝至此
    root /usr/share/nginx/html;
    index index.html;

    # 檔案上傳大小限制：與後端 20MB multipart 限制對齊並留餘量
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vue Router history 模式：非靜態路徑一律回退到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 產物位於 /assets/ 且文件名帶內容哈希，可長緩存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理到後端容器（docker compose 服務名 backend，端口 8080）
    # proxy_pass 不帶路徑：/api/ 前綴原樣轉發，後端接口均映射在 /api/** 之下
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
